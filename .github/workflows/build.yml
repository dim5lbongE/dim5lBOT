name: Build and verify dim5lBOT

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: Android64
            os: ubuntu-latest
            target: Android64
          - name: Android32
            os: ubuntu-latest
            target: Android32
    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build platform binary
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: ${{ matrix.config.target }}
          combine: true

  package:
    name: Package universal Geode mod
    runs-on: ubuntu-latest
    needs: [build-release]
    steps:
      - name: Combine Windows, Android64, and Android32 builds
        id: build
        uses: geode-sdk/build-geode-mod/combine@main
      - name: Upload universal mod
        uses: actions/upload-artifact@v4
        with:
          name: dim5lBOT-Universal
          path: ${{ steps.build.outputs.build-output }}
