name: Build Windows Updater

on:
  workflow_dispatch:
  push:
    paths:
      - 'dim5lbot-updater-windows/**'
      - '.github/workflows/build-windows-updater.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single-file updater
        run: dotnet publish dim5lbot-updater-windows/dim5lBOT.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: dim5lBOT-Updater-Windows
          path: publish/dim5lBOT-Updater.exe
          if-no-files-found: error
